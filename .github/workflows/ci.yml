name: Production CI

on:
  push:
    branches:
      - audience-intelligence-agents
  pull_request:
    branches:
      - main
      - dev
      - audience-intelligence-agents
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  LOCAL_SEMANTIC_MODEL: sentence-transformers/all-MiniLM-L6-v2
  LOCAL_SEMANTIC_MODEL_REVISION: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  LOCAL_SEMANTIC_MODEL_CACHE: .model-cache
  APP_ENV: local
  PRODUCTION_MODE: "false"
  REQUIRE_AUDIENCE_API_KEY: "false"
  AUDIENCE_API_KEY: test-key
  ECHO_DATABASE_URL: postgresql://user:pass@localhost:5432/testdb
  HASH_SECRET: test-hash-secret
  AUDIENCE_HASH_SALT: test-audience-salt
  ALLOW_LOCAL_FILE_STORAGE: "true"
  ALLOW_DEMO_ROUTES: "true"
  VECTOR_BACKEND: local

jobs:
  test:
    name: Tests and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audience_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d audience_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      AUDIENCE_TEST_DATABASE_URL: >-
        postgresql://postgres:postgres@127.0.0.1:5432/audience_ci

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            uv.lock
            requirements-ci.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libpq-dev

      - name: Install locked application and CI dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-ci.txt
          uv sync --frozen

      - name: Restore immutable semantic model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .model-cache
          key: semantic-model-${{ runner.os }}-${{ env.LOCAL_SEMANTIC_MODEL_REVISION }}

      - name: Prefetch immutable semantic model
        run: uv run --frozen python scripts/prefetch_local_semantic_model.py

      - name: Compile all Python sources
        run: uv run --frozen python -m compileall -q app scripts tests

      - name: Validate migration ordering
        run: >-
          PYTHONPATH=. uv run --frozen python -m pytest -q
          tests/test_migration_version_uniqueness.py

      - name: Run full suite with PostgreSQL integration
        run: |
          mkdir -p artifacts
          PYTHONPATH=. uv run --frozen python -m pytest -q --junitxml=artifacts/pytest.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-evidence-${{ github.sha }}
          path: artifacts/pytest.xml
          if-no-files-found: error
          retention-days: 30

  security:
    name: Source, dependency, and IaC gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Audit Python dependency vulnerabilities
        run: |
          uv sync --frozen --no-dev
          RUNTIME_SITE_PACKAGES="$(
            uv run --frozen --no-dev python -c \
              'import site; print(site.getsitepackages()[0])'
          )"
          pip-audit --path "$RUNTIME_SITE_PACKAGES" --progress-spinner off

      - name: Block high-severity Python security findings
        run: >-
          bandit -r app scripts
          --severity-level high
          --confidence-level medium
          --quiet

      - name: Validate CloudFormation templates
        run: cfn-lint infrastructure/cloudformation/*.yaml

      - name: Validate CI supply-chain contract
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_production_ci_supply_chain.py
          tests/test_production_model_artifact_pinning.py

  container:
    name: Container, smoke, vulnerability, and SBOM gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - test
      - security
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build immutable candidate image
        run: docker build --pull --tag punk-audience-engine:${{ github.sha }} .

      - name: Start candidate container
        run: |
          docker run --detach --rm \
            --name punk-audience-engine-ci \
            --publish 127.0.0.1:18000:8000 \
            --env APP_ENV=local \
            --env PRODUCTION_MODE=false \
            --env REQUIRE_AUDIENCE_API_KEY=false \
            --env AUDIENCE_API_KEY=test-key \
            --env HASH_SECRET=test-hash-secret \
            --env AUDIENCE_HASH_SALT=test-audience-salt \
            --env ALLOW_LOCAL_FILE_STORAGE=true \
            --env ALLOW_DEMO_ROUTES=false \
            --env VECTOR_BACKEND=local \
            punk-audience-engine:${{ github.sha }}

      - name: Verify container health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs punk-audience-engine-ci
          exit 1

      - name: Stop candidate container
        if: always()
        run: docker stop punk-audience-engine-ci 2>/dev/null || true

      - name: Block critical container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: punk-audience-engine:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: punk-audience-engine:${{ github.sha }}
          format: cyclonedx
          output: artifacts/punk-audience-engine.sbom.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SBOM with GitHub OIDC identity
        run: >-
          cosign sign-blob --yes
          --bundle artifacts/punk-audience-engine.sbom.sigstore.json
          artifacts/punk-audience-engine.sbom.cdx.json

      - name: Upload container SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-sbom-${{ github.sha }}
          path: |
            artifacts/punk-audience-engine.sbom.cdx.json
            artifacts/punk-audience-engine.sbom.sigstore.json
          if-no-files-found: error
          retention-days: 90
