name: CI

on:
  push:
    branches:
      - audience-intelligence-agents
  pull_request:
    branches:
      - main
      - dev
      - audience-intelligence-agents

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: local
      PRODUCTION_MODE: "false"
      REQUIRE_AUDIENCE_API_KEY: "false"
      AUDIENCE_API_KEY: test-key
      ECHO_DATABASE_URL: postgresql://user:pass@localhost:5432/testdb
      HASH_SECRET: test-hash-secret
      AUDIENCE_HASH_SALT: test-audience-salt
      ALLOW_LOCAL_FILE_STORAGE: "true"
      ALLOW_DEMO_ROUTES: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile app
        run: |
          python -m compileall app

      - name: Run full test suite
        run: |
          PYTHONPATH=. python -m pytest -q
