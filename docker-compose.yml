services:
  audience-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: punk-audience-engine
    env_file:
      - .env
    environment:
      APP_ENV: production
      PRODUCTION_MODE: "true"
      REQUIRE_AUDIENCE_API_KEY: "true"
      ALLOW_LOCAL_FILE_STORAGE: "false"
      ALLOW_DEMO_ROUTES: "false"
      VECTOR_BACKEND: "postgres_array"
      EMBEDDING_BACKEND: "sklearn_hashing"
      ALL_SAFE_COHORT_EMBEDDING_STORE: "postgres"
      AUDIENCE_JOB_STORE_BACKEND: "postgres"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
