name: punk-audience-phase2-local

services:
  phase2-pgvector:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    container_name: punk-phase2-pgvector
    environment:
      POSTGRES_DB: ${PHASE2_PGVECTOR_DATABASE:-punk_audience_features}
      POSTGRES_USER: ${PHASE2_PGVECTOR_USER:-punk_feature_admin}
      POSTGRES_PASSWORD: ${PHASE2_PGVECTOR_PASSWORD:?Set PHASE2_PGVECTOR_PASSWORD}
    ports:
      - "127.0.0.1:${PHASE2_PGVECTOR_PORT:-55432}:5432"
    volumes:
      - phase2-pgvector-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "no"

volumes:
  phase2-pgvector-data:
    name: punk-phase2-pgvector-data
