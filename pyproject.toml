[project]
name = "punk-audience-engine"
version = "0.1.0"
description = "Governed audience intelligence data and decision engine"
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3",
    "fastapi",
    "langgraph==1.2.11",
    "numpy",
    "pandas",
    "psycopg2-binary",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "scikit-learn",
    "sdv>=1.37.3",
    "sentence-transformers",
    "sqlalchemy",
    "torch==2.13.0",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
required-version = "==0.11.33"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
